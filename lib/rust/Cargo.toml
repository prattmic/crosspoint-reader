# Rust components of the firmware. Each crate is an rlib for one area of the
# codebase; staticlib bundles them into the single librust_lib.a that the
# firmware and host tests link, so std is linked only once.
[workspace]
resolver = "3"
members = ["build-support", "epub", "staticlib"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
build-support = { path = "build-support" }
epub = { path = "epub" }
phf = { version = "0.14.0", features = ["macros"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
